  <!-- Script បោសសម្អាតពណ៌បៃតងចោលជាស្វ័យប្រវត្តិ -->
  <script>
    function purgeGreenTheme() {
      document.body.classList.remove('theme-tinted');
      document.body.classList.add('theme-light');
      
      const leftCol = document.getElementById('LeftColumn') || document.querySelector('.LeftColumn');
      if (leftCol) {
        const els = leftCol.querySelectorAll('*');
        for (let i = 0; i < els.length; i++) {
          const bg = window.getComputedStyle(els[i]).backgroundColor;
          if (bg.startsWith('rgb')) {
            const rgb = bg.match(/\d+/g);
            if (rgb && rgb.length >= 3) {
              const [r, g, b] = rgb.map(Number);
              if (g > r + 15 && g > b + 15) {
                els[i].style.setProperty('background-color', '#ebf0fe', 'important');
              }
            }
          }
        }
      }
    }
    setInterval(purgeGreenTheme, 400);
  </script>
