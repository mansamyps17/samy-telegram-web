  <!-- JAVASCRIPT: បង្ខំលុបពណ៌ផ្សេងៗ និងកំណត់ Style ផ្ទាល់ទៅ Element គ្រប់វិនាទី (Aggressive Force) -->
  <script>
    function forceMasterTheme() {
      // 1. លុប Theme Classes ផ្សេងៗចោល
      ['theme-dark', 'theme-tinted', 'theme-colorful'].forEach(c => {
        document.body.classList.remove(c);
        document.documentElement.classList.remove(c);
      });
      document.body.classList.add('theme-light');
      document.documentElement.classList.add('theme-light');

      // 2. បង្ខំ Sidebar ឱ្យចេញពណ៌ផ្ទៃមេឃស្រាល
      const sidebars = document.querySelectorAll('nav, .sidebar-compact, .sidebar-compact-wrapper, .folders-tabs, .TabList, #LeftColumn-main, .LeftColumn-main');
      sidebars.forEach(el => {
        el.setAttribute('style', 'background-color: #e9eefb !important; background: #e9eefb !important;');
      });

      // 3. បង្ខំ Chat Background ឱ្យចេញ Gradient ផ្ទៃមេឃ-ស្វាយ
      const chatsBg = document.querySelectorAll('.MiddleColumn, .chat-background, .Pattern');
      chatsBg.forEach(el => {
         el.setAttribute('style', 'background: linear-gradient(135deg, #e4ecfe 0%, #f4ebfa 50%, #e6effe 100%) !important;');
      });
    }
    // ដំណើរការរៀងរាល់ 100ms ដើម្បីកុំឱ្យ Telegram អាចប្តូរពណ៌បានវិញ
    setInterval(forceMasterTheme, 100);
  </script>
