  <style>
    /* ================================================================= */
    /* ១. រៀបចំផ្ទៃ FRAME ធានាថាខាងលើស្មើជួរគ្នា និងខាងក្រោមមិនដាច់       */
    /* ================================================================= */
    html, body#root {
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      box-sizing: border-box !important;
      overflow: hidden !important;
      background-color: #eaeffe !important;
    }

    /* របារ Title Bar កម្ពស់ 32px ស្មើជួរជាមួយប៊ូតុង Windows */
    #custom-titlebar {
      position: fixed;
      top: 0;
      left: 0;
      width: calc(100% - 140px);
      height: 32px;
      background-color: #eaeffe !important;
      display: flex;
      align-items: center;
      padding-left: 14px;
      z-index: 99999999;
      -webkit-app-region: drag;
      user-select: none;
      box-sizing: border-box;
    }
    .titlebar-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .titlebar-logo {
      width: 19px;
      height: 19px;
      filter: drop-shadow(0 2px 4px rgba(42, 171, 238, 0.4));
    }
    .titlebar-text {
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
    }

    /* រុញផ្ទៃក្នុង Telegram ចុះក្រោម 32px ដើម្បីកុំឱ្យបាំង Title Bar និងមិនដាច់បាត */
    body#root {
      padding-top: 32px !important;
    }
    #Main, .Main {
      height: 100% !important;
      max-height: 100% !important;
      box-sizing: border-box !important;
    }

    /* ================================================================= */
    /* ២. កម្ទេចពណ៌បៃតងចាស់ និងប្ដូរទៅ THEME MODERN BLUE-PURPLE         */
    /* ================================================================= */
    * { font-family: 'Kantumruy Pro', sans-serif !important; }

    :root, html, body#root, .theme-light, .theme-dark, .theme-tinted {
      --color-background-compact-menu: #eaeffe !important;
      --color-background-compact-menu-hover: #dfe6fd !important;
      --color-background-compact-menu-active: #d5e0fc !important;
      --color-background: #ffffff !important;
      --color-background-secondary: #f1f4fa !important;
      --color-background-secondary-accent: #eaeffe !important;
      --color-header-background: rgba(255, 255, 255, 0.9) !important;
      --color-chat-active: #675eff !important;
      --color-primary: #675eff !important;
      --color-primary-shade: #554bf0 !important;
      --color-green: #675eff !important;
      --color-accent-green: #675eff !important;
      --color-message-status-read: #675eff !important;
      --color-voice-record: #675eff !important;
      --color-background-own: #eeeaff !important;
      --color-text-own: #1e293b !important;
    }

    /* ជួរ Folder ខាងឆ្វេងបង្អស់ (ពណ៌ផ្ទៃមេឃស្រាល) */
    #LeftColumn-main,
    .LeftColumn-main,
    .sidebar-compact,
    .sidebar-compact-wrapper,
    .folders-tabs,
    .folders-tab,
    .TabList,
    nav {
      background: #eaeffe !important;
      background-color: #eaeffe !important;
      border-right: 1px solid rgba(0, 0, 0, 0.04) !important;
    }
    .Tab.active, .Tab.active i { color: #675eff !important; }
    .Tab.active .badge { background-color: #675eff !important; color: #fff !important; }

    /* Header ខាងឆ្វេង និងស្ដាំ (កម្ពស់ស្មើគ្នា 56px ត្រង់ភ្លឹង) */
    .Header, .LeftHeader, .MiddleHeader, .RightHeader, .sidebar-header {
      height: 56px !important;
      min-height: 56px !important;
      background-color: rgba(255, 255, 255, 0.9) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05) !important;
      box-sizing: border-box !important;
    }

    /* បញ្ជីឈ្មោះ Chat ពណ៌សកោងមូលស្អាត */
    .LeftColumn, .chat-list, .Transition, .Settings-main {
      background-color: #ffffff !important;
    }
    .SearchInput .input-field, .SearchInput .input-field-input {
      background-color: #f1f4fa !important;
      border-radius: 20px !important;
    }

    /* Chat ដែលកំពុងចុច (Active Chat) */
    .ListItem.active, .chat-list-item.active {
      background: linear-gradient(100deg, #675eff 0%, #877eff 100%) !important;
      border-radius: 14px !important;
      margin: 3px 8px !important;
      width: calc(100% - 16px) !important;
      box-shadow: 0 4px 14px rgba(103, 94, 255, 0.35) !important;
      border: none !important;
    }
    .ListItem.active .title,
    .ListItem.active .subtitle,
    .ListItem.active .message-time,
    .ListItem.active .last-message,
    .ListItem.active p {
      color: #ffffff !important;
    }
    .ListItem.active .Badge,
    .ListItem.active .badge {
      background-color: #ffffff !important;
      color: #675eff !important;
      font-weight: 700 !important;
    }
    .ListItem.active i, .ListItem.active .icon {
      color: #ffffff !important;
      fill: #ffffff !important;
    }

    /* ================================================================= */
    /* ៣. ប្ដូរពណ៌សញ្ញាធីក ✔✔ និង VOICE MESSAGE ពីបៃតង ទៅស្វាយ/ខៀវ        */
    /* ================================================================= */
    .icon-message-read,
    .icon-check,
    .icon-double-check,
    .Message-status,
    .message-status,
    [class*="status-read"],
    [class*="message-read"] {
      color: #675eff !important;
      fill: #675eff !important;
    }

    .Audio .toggle-action,
    .Audio button,
    .voice-play-button,
    [class*="Audio"] button {
      background-color: #675eff !important;
      color: #ffffff !important;
    }

    /* ផ្ទាំង Chat ធំ (Gradient ផ្ទៃមេឃកាត់ផ្កាឈូកស្រាល) */
    .MiddleColumn, #MiddleColumn, .chat-background, .messages-layout, .Pattern, .MessageList {
      background: linear-gradient(135deg, #e4ecfe 0%, #fbeaf7 50%, #e6effe 100%) !important;
    }

    .svg-appendix { display: none !important; }

    /* ប្រអប់សារផ្ញើចេញ */
    .message-outgoing .bubble, .Message.own .bubble {
      background: #eeeaff !important;
      color: #1e293b !important;
      border-radius: 18px 18px 4px 18px !important;
      border: 1px solid rgba(103, 94, 255, 0.12) !important;
      box-shadow: 0 2px 6px rgba(103, 94, 255, 0.05) !important;
    }

    /* ប្រអប់សារផ្ញើចូល */
    .message-incoming .bubble, .Message:not(.own) .bubble {
      background: #ffffff !important;
      color: #1e293b !important;
      border-radius: 18px 18px 18px 4px !important;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04) !important;
    }

    /* ធានាថាប្រអប់វាយអក្សរខាងក្រោមមិនកាត់ដាច់ */
    .middle-column-footer, .chat-input, .Composer {
      background-color: transparent !important;
      padding-bottom: 8px !important;
    }
  </style>

  <!-- Script បោសសម្អាតពណ៌បៃតងលើ Folder Sidebar -->
  <script>
    function enforceModernTheme() {
      if (document.body) {
        document.body.classList.remove('theme-tinted');
        document.body.classList.add('theme-light');
      }
      document.documentElement.classList.remove('theme-tinted');

      const sidebars = document.querySelectorAll('#LeftColumn-main, .LeftColumn-main, .sidebar-compact, .folders-tabs, nav, .TabList');
      sidebars.forEach(el => {
        el.style.setProperty('background-color', '#eaeffe', 'important');
        el.style.setProperty('background', '#eaeffe', 'important');
      });
    }
    setInterval(enforceModernTheme, 200);
  </script>
