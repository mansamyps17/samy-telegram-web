  <style>
    /* ================================================================= */
    /* ១. រៀបចំផ្ទៃ FRAME និង TITLE BAR ឱ្យស្មើគ្នា មិនឱ្យដាច់ខាងក្រោម     */
    /* ================================================================= */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
      background-color: #eaeffe !important;
    }

    /* របារចំណងជើង Mii mama gram ខាងលើបង្អស់ */
    #custom-titlebar {
      position: fixed;
      top: 0;
      left: 0;
      width: calc(100% - 140px);
      height: 36px;
      background-color: #eaeffe !important;
      display: flex;
      align-items: center;
      padding-left: 14px;
      z-index: 99999999;
      -webkit-app-region: drag;
      user-select: none;
    }
    .titlebar-box {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .titlebar-logo {
      width: 20px;
      height: 20px;
      filter: drop-shadow(0 2px 5px rgba(42, 171, 238, 0.4));
    }
    .titlebar-text {
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: 0.2px;
    }

    /* ចាប់ផ្ទាំង Telegram ទាំងមូលឱ្យនៅចន្លោះ 36px ដល់បាតក្រោមបង្អស់ (មិនដាច់) */
    #root {
      position: fixed !important;
      top: 36px !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      width: 100vw !important;
      height: calc(100vh - 36px) !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
    }

    /* ================================================================= */
    /* ២. កម្ទេចពណ៌បៃតងចាស់ (OVERRIDE CSS VARIABLES របស់ TELEGRAM)        */
    /* ================================================================= */
    * { font-family: 'Kantumruy Pro', sans-serif !important; }

    :root, html, body, #root, .theme-light, .theme-dark, .theme-tinted {
      --color-background-compact-menu: #eaeffe !important;
      --color-background-compact-menu-hover: #dfe6fd !important;
      --color-background-compact-menu-active: #d5e0fc !important;
      --color-background: #ffffff !important;
      --color-background-secondary: #f1f4fa !important;
      --color-background-secondary-accent: #eaeffe !important;
      --color-header-background: rgba(255, 255, 255, 0.9) !important;
      --color-chat-active: #675eff !important;
      --color-primary: #675eff !important;
      --color-background-own: #eeeaff !important;
      --color-text-own: #1e293b !important;
    }

    /* បញ្ជី Folder ខាងឆ្វេងបង្អស់ (ដកពណ៌បៃតងចេញ ជំនួសដោយពណ៌ផ្ទៃមេឃស្រាល) */
    #LeftColumn-main,
    .LeftColumn-main,
    .sidebar-compact,
    .sidebar-compact-wrapper,
    .folders-tabs,
    .TabList,
    nav {
      background: #eaeffe !important;
      background-color: #eaeffe !important;
      border-right: 1px solid rgba(0, 0, 0, 0.04) !important;
    }

    .Tab.active, .Tab.active i { color: #675eff !important; }
    .Tab.active .badge { background-color: #675eff !important; color: #fff !important; }

    /* ================================================================= */
    /* ៣. តម្រឹម HEADER ខាងលើឱ្យស្មើជួរគ្នា និងបញ្ជី CHAT កោងមូលស្អាត       */
    /* ================================================================= */
    /* Header ខាងឆ្វេង និង Header ខាងស្ដាំ ត្រូវតែស្មើកំពស់ និងពណ៌ដូចគ្នា */
    .Header, .LeftHeader, .MiddleHeader, .RightHeader, .sidebar-header {
      height: 56px !important;
      min-height: 56px !important;
      max-height: 56px !important;
      background-color: rgba(255, 255, 255, 0.9) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05) !important;
      box-sizing: border-box !important;
    }

    /* បញ្ជីឈ្មោះ Chat ពណ៌សកោងមូលស្អាត */
    .LeftColumn, 
    .chat-list, 
    .Transition, 
    .Settings-main {
      background-color: #ffffff !important;
      border-radius: 18px 0 0 0 !important;
    }

    .SearchInput .input-field, .SearchInput .input-field-input {
      background-color: #f1f4fa !important;
      border-radius: 20px !important;
    }

    /* Animation និងពណ៌លើ Chat List */
    .ListItem, .chat-list-item {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
      border-radius: 14px !important;
      margin: 3px 8px !important;
      width: calc(100% - 16px) !important;
    }
    .ListItem:hover:not(.active), .chat-list-item:hover:not(.active) {
      background-color: #f4f6fd !important;
      transform: translateX(4px) !important;
    }

    /* Chat ដែលកំពុងបើក (Gradient ស្វាយ-ខៀវ) */
    .ListItem.active, .chat-list-item.active {
      background: linear-gradient(100deg, #675eff 0%, #877eff 100%) !important;
      box-shadow: 0 4px 14px rgba(103, 94, 255, 0.35) !important;
      border: none !important;
    }
    .ListItem.active * { color: #ffffff !important; }

    /* ================================================================= */
    /* ៤. ផ្ទៃ CHAT ខាងស្ដាំ និងប្រអប់សារ (BUBBLES)                      */
    /* ================================================================= */
    .MiddleColumn, #MiddleColumn, .chat-background, .messages-layout, .Pattern, .MessageList {
      background: linear-gradient(135deg, #e4ecfe 0%, #fbeaf7 50%, #e6effe 100%) !important;
    }

    .svg-appendix { display: none !important; } /* លុបកន្ទុយសារ */

    /* ប្រអប់សារផ្ញើចេញ */
    .message-outgoing .bubble, .Message.own .bubble {
      background: #eeeaff !important;
      color: #1e293b !important;
      border-radius: 18px 18px 4px 18px !important;
      border: 1px solid rgba(103, 94, 255, 0.12) !important;
      box-shadow: 0 2px 6px rgba(103, 94, 255, 0.05) !important;
    }

    /* ប្រអប់សារផ្ញើចូល */
    .message-incoming .bubble, .Message:not(.own) .bubble {
      background: #ffffff !important;
      color: #1e293b !important;
      border-radius: 18px 18px 18px 4px !important;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04) !important;
    }

    /* ធានាថាប្រអប់ Input ខាងក្រោមបង្ហាញពេញភ្នែក មិនដាច់ */
    .middle-column-footer, .chat-input, .Composer {
      background-color: transparent !important;
      padding-bottom: 8px !important;
    }
  </style>

  <!-- កម្ចាត់ Theme Tinted (ពណ៌បៃតង) គ្រប់វិនាទី -->
  <script>
    const cleanTintedTheme = () => {
      document.body.classList.remove('theme-tinted');
      document.body.classList.add('theme-light');
      document.documentElement.classList.remove('theme-tinted');

      // បង្ខំលុប background ពណ៌បៃតងលើ Folder sidebar
      const sidebars = document.querySelectorAll('#LeftColumn-main, .LeftColumn-main, .sidebar-compact, .folders-tabs, nav');
      sidebars.forEach(el => {
        el.style.setProperty('background-color', '#eaeffe', 'important');
        el.style.setProperty('background', '#eaeffe', 'important');
      });
    };
    cleanTintedTheme();
    setInterval(cleanTintedTheme, 200);
  </script>
