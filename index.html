  <script>
    const stripGreenTheme = () => {
      if (document.body.classList.contains('theme-tinted')) {
        document.body.classList.remove('theme-tinted');
        document.body.classList.add('theme-light');
      }
    };
    stripGreenTheme();
    new MutationObserver(stripGreenTheme).observe(document.body, { attributes: true, attributeFilter: ['class'] });
