    #Main, .Main, #LeftColumn, #LeftColumn-main, .LeftColumn-main,

      box-shadow: 0 4px 12px rgba(108, 99, 255, 0.3) !important; border: none !important;
    }
    .ListItem.active *, .chat-list-item.active * { color: #ffffff !important; fill: #ffffff !important; }
    .ListItem.active .badge, .ListItem.active .Badge { background-color: #ffffff !important; color: #6c63ff !important; font-weight: bold !important; }

    /* កំណត់ Header ពណ៌ស សម្រាប់តែផ្ទាំង Chat ធម្មតាប៉ុណ្ណោះ (មិនឱ្យប៉ះ MediaViewer) */

    .icon-message-read, .icon-check, .icon-double-check, .Message-status { color: #6c63ff !important; fill: #6c63ff !important; }

    .message-incoming .bubble, .Message:not(.own) .bubble {

<body>
  <!-- លុប Title Bar HTML ចោលទាំងស្រុង ទុកឱ្យ Windows ជាអ្នកគ្រប់គ្រង -->
  <div id="root"></div>
  <div id="portals"></div>
  <script src="./compatTest.js"></script>

  <!-- JAVASCRIPT: បោសសម្អាតពណ៌ឈាមជ្រូកពីជួរ Folder ខាងឆ្វេង និងលុបពណ៌សលើផ្ទាំងរូបថត -->
  <script>
    setInterval(() => {
      document.body.className = 'theme-light';
      document.documentElement.className = 'theme-light';

      // ស្វែងរកធាតុនៅខាងឆ្វេងបង្អស់ ហើយលាបពណ៌ផ្ទៃមេឃស្រាល
      const allDivs = document.querySelectorAll('div, nav, aside, ul');
      allDivs.forEach(el => {
        const rect = el.getBoundingClientRect();
        if (rect.left < 90 && rect.width >= 40 && rect.width <= 110 && rect.height > 200) {
          el.style.setProperty('background-color', '#e9eefb', 'important');
          el.style.setProperty('background', '#e9eefb', 'important');
          el.style.setProperty('background-image', 'none', 'important');
        }
      });

      // បង្ខំឱ្យ MediaViewer header គ្មានពណ៌សជាដាច់ខាត
      const mvHeaders = document.querySelectorAll('#MediaViewer .Header, .MediaViewer-header, dialog#MediaViewer header');
      mvHeaders.forEach(h => {
        h.style.setProperty('background-color', 'transparent', 'important');
        h.style.setProperty('background', 'transparent', 'important');
      });
    }, 100);
  </script>
