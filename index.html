  <!-- JAVASCRIPT SCANNER: ត្រួតពិនិត្យ Media Viewer និងលុបពណ៌សរំខាន -->
  <script>
    setInterval(() => {
      // 1. ពិនិត្យមើលវត្តមានផ្ទាំង Media Viewer
      const mv = document.querySelector('#MediaViewer, .MediaViewer, [class*="MediaViewer"], [class*="media-viewer"]');
      const tb = document.getElementById('custom-titlebar');
      
      if (mv && mv.offsetParent !== null) {
        if (tb) tb.style.setProperty('display', 'none', 'important');
        document.body.classList.add('in-media-viewer');
        
        // បង្ខំឱ្យរាល់ Header ក្នុង Media Viewer ថ្លា (គ្មានពណ៌ស)
        const mvHeaders = mv.querySelectorAll('.Header, header, [class*="header"], [class*="head"]');
        mvHeaders.forEach(h => {
          h.style.setProperty('background-color', 'transparent', 'important');
          h.style.setProperty('background', 'transparent', 'important');
        });
      } else {
        if (tb) tb.style.setProperty('display', 'flex', 'important');
        document.body.classList.remove('in-media-viewer');
      }

      // 2. ជម្រះពណ៌ឈាមជ្រូកពីជួរ Folder ខាងឆ្វេង
      const allDivs = document.querySelectorAll('div, nav, aside, ul');
      allDivs.forEach(el => {
        const rect = el.getBoundingClientRect();
        if (rect.left < 90 && rect.width >= 40 && rect.width <= 110 && rect.height > 200) {
          el.style.setProperty('background-color', '#e9eefb', 'important');
          el.style.setProperty('background', '#e9eefb', 'important');
          el.style.setProperty('background-image', 'none', 'important');
        }
      });
    }, 100);
  </script>
