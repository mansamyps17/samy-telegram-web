  <script>
    const enforceModernTheme = () => {
      document.body.classList.remove('theme-tinted', 'theme-dark');
      document.body.classList.add('theme-light');
      document.documentElement.classList.remove('theme-tinted', 'theme-dark');

      const selectors = ['#LeftColumn-main', '.LeftColumn-main', '.folders-tabs', '.sidebar-compact', 'nav'];
      selectors.forEach(s => {
        document.querySelectorAll(s).forEach(el => {
          el.style.setProperty('background-color', '#eaeffe', 'important');
          el.style.setProperty('background', '#eaeffe', 'important');
        });
      });
    };
    setInterval(enforceModernTheme, 150);
  </script>
