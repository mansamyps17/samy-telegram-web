<body>
  <!-- មិនមាន Custom Title Bar ទេ ទុកឱ្យ Windows រៀបចំឱ្យ -->
  <div id="root"></div>
  <div id="portals"></div>
  <script src="./compatTest.js"></script>

  <!-- Auto Purge ពណ៌ខ្មៅ ពណ៌បៃតង និងពណ៌ប្រផេះរៀងរាល់ 100ms -->
  <script>
    setInterval(() => {
      // បោសសម្អាត Class កម្រិតឯកសារ
      document.body.classList.remove('theme-dark', 'theme-tinted');
      document.body.classList.add('theme-light');
      document.documentElement.classList.remove('theme-dark', 'theme-tinted');
      document.documentElement.classList.add('theme-light');
      document.documentElement.setAttribute('data-theme', 'light');

      // បង្ខំលាបពណ៌ស/ខៀវស្រាល លើ Folder Bar
      document.querySelectorAll('nav, .sidebar-compact, .sidebar-compact-wrapper, .folders-tabs, .TabList, #LeftColumn-main, .LeftColumn-main').forEach(el => {
        el.style.setProperty('background-color', '#f1f4fa', 'important');
        el.style.setProperty('background', '#f1f4fa', 'important');
      });

      // វាយប្រហារទៅលើសញ្ញាធីក ✔✔ ឱ្យចេញពណ៌ស្វាយ
      document.querySelectorAll('.icon-message-read, .icon-check, .icon-double-check').forEach(icon => {
        // បើមិនមែននៅក្នុង Active Chat ទេ
        if (!icon.closest('.ListItem.active, .chat-list-item.active')) {
          icon.style.setProperty('color', '#6c63ff', 'important');
          icon.style.setProperty('fill', '#6c63ff', 'important');
        }
      });
    }, 100);
  </script>
