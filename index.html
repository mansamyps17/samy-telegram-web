  <!-- កូដកម្ទេចពណ៌ក្រហម/បៃតង ដោយប្រើបច្ចេកទេសទីតាំងប្រអប់ (Physical Bounding Box Attack) -->
  <script>
    setInterval(() => {
      // 1. រុញ Style របស់យើងទៅក្រោយគេបង្អស់ជានិច្ច ដើម្បីកុំឱ្យ Telegram យក Theme វាមកជាន់
      const nuclearStyle = document.getElementById('mii-mama-nuclear-style');
      if (nuclearStyle) { document.head.appendChild(nuclearStyle); }

      // 2. លុប Class Theme ក្រហមចេញពី Body
      document.body.className = 'theme-light';
      document.documentElement.className = 'theme-light';

      // 3. ស្វែងរកប្រអប់ Sidebar ខាងឆ្វេងបង្អស់ (កម្ចាត់ពណ៌ក្រហមដិត)
      const allDivs = document.querySelectorAll('div, nav, aside');
      allDivs.forEach(el => {
          const rect = el.getBoundingClientRect();
          // ប្រសិនបើវាជាប្រអប់ដែលឈរនៅខាងឆ្វេងកៀនគេ (Left ជិត 0) និងមានទំហំទទឹងចន្លោះ 50px-100px (ទំហំ Folder Sidebar)
          if (rect.left <= 10 && rect.width >= 50 && rect.width <= 105 && rect.height > 300) {
              el.style.setProperty('background-color', '#e9eefb', 'important');
              el.style.setProperty('background', '#e9eefb', 'important');
              el.style.setProperty('background-image', 'none', 'important'); // លុបកុំឱ្យជាប់ Gradient ក្រហម
          }
      });
    }, 200); // ឆែកនិងវាយប្រហាររៀងរាល់ 0.2 វិនាទីម្តង
  </script>
